<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saeed AI Chat</title>
<style>
:root{font-family:"Segoe UI",Inter,Arial,sans-serif;color:#eef3f8;background:#090d14}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d14}
body{min-width:520px}.app{height:100%;display:grid;grid-template-columns:260px minmax(0,1fr);background:linear-gradient(135deg,#0b111a,#101722 55%,#0b1119)}
.sidebar{background:rgba(12,17,25,.96);border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column}
.sideHead{height:70px;padding:0 20px;display:flex;align-items:center;font-size:19px;font-weight:700;letter-spacing:.2px;border-bottom:1px solid rgba(255,255,255,.07)}
.contact{display:flex;align-items:center;gap:12px;margin:14px;padding:12px;border-radius:14px;background:linear-gradient(135deg,rgba(54,93,150,.24),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.07)}
.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:linear-gradient(145deg,#4e8fe8,#315d9f);display:grid;place-items:center;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.contact b{font-size:14px}.contact small{display:block;color:#9daab7;margin-top:4px;font-size:11px}.sideHint{margin:auto 16px 16px;padding:12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);font-size:11px;line-height:1.5;color:#8997a7}
.chat{min-width:0;display:flex;flex-direction:column;background:rgba(9,14,21,.76)}
.chatHead{height:70px;flex:0 0 70px;display:flex;align-items:center;padding:10px 20px;background:rgba(17,24,34,.94);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}
.chatHead b{font-size:16px}.chatHead span{display:block;font-size:11px;color:#8fa0b0;margin-top:4px}.chatHead .close{margin-left:auto;width:38px;height:38px;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:rgba(255,255,255,.045);color:#dce4ec;font-size:23px;cursor:pointer}.chatHead .close:hover{background:rgba(255,255,255,.1)}
.messages{flex:1;min-height:0;overflow:auto;padding:24px 30px 20px;background:radial-gradient(circle at 50% 0%,rgba(52,87,130,.18),transparent 42%),#090e15}
.msg{max-width:min(760px,78%);padding:12px 15px;border-radius:16px;margin:10px 0;line-height:1.6;font-size:13px;white-space:pre-wrap;box-shadow:0 8px 28px rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.045)}
.assistant{background:linear-gradient(145deg,rgba(30,40,53,.96),rgba(24,32,43,.96));border-top-left-radius:6px}.user{margin-left:auto;background:linear-gradient(145deg,#315d9f,#284e87);border-top-right-radius:6px}
.meta{font-size:10px;color:#9da9af;margin-top:5px;text-align:right}.composer{display:flex;gap:10px;padding:14px 18px 18px;background:rgba(17,24,34,.94);border-top:1px solid rgba(255,255,255,.07);backdrop-filter:blur(18px)}
.composer textarea{flex:1;min-width:0;height:52px;resize:none;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:#111a25;color:#edf2f7;padding:14px 15px;outline:0;font:13px "Segoe UI";box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.composer textarea:focus{border-color:rgba(95,156,255,.55);box-shadow:0 0 0 3px rgba(95,156,255,.1)}
.composer button{width:50px;height:52px;border:0;border-radius:14px;background:linear-gradient(145deg,#4d8fe8,#315d9f);color:#fff;cursor:pointer;font-size:18px;box-shadow:0 8px 22px rgba(49,93,159,.25)}.composer button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.stop{background:rgba(150,60,60,.32)!important;box-shadow:none!important}@media(max-width:720px){body{min-width:0}.app{grid-template-columns:1fr}.sidebar{display:none}.messages{padding:18px}.msg{max-width:88%}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="sideHead">Saeed AI</div><div class="contact"><div class="avatar">S</div><div><b>Saeed</b><small>Desktop AI Agent</small></div></div><div class="sideHint">Your conversations with Saeed appear here. The desktop companion remains active while this chat window is open.</div></aside>
<main class="chat"><header class="chatHead"><div><b>Saeed</b><span id="state">Ready</span></div><button class="close" id="close" aria-label="Close">×</button></header>
<div id="messages" class="messages"><div class="msg assistant">Hello. I am Saeed. How can I help you?</div></div>
<footer class="composer"><textarea id="input" placeholder="Type a message"></textarea><button id="stop" class="stop" title="Stop">■</button><button id="send" title="Send">➤</button></footer></main></div>
<script>
const $=id=>document.getElementById(id),post=m=>window.chrome?.webview?.postMessage(m),box=$('messages');
function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight;}
function send(){const t=$('input').value.trim();if(!t)return;$('input').value='';add('user',t);$('state').textContent='Thinking';post({type:'chat',text:t});}
$('send').onclick=send;$('stop').onclick=()=>post({type:'cancel_agent'});$('close').onclick=()=>post({type:'close_window'});
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}if(e.key==='Escape'){e.preventDefault();post({type:'close_window'})}};
window.chrome?.webview?.addEventListener('message',e=>{const d=e.data||{};if(d.type==='answer'){add('assistant',d.text||'');$('state').textContent='Ready';}if(d.type==='status')$('state').textContent=d.text||'Working';if(d.type==='error'){add('assistant','Error: '+(d.text||'Unknown error'));$('state').textContent='Ready';}});
</script></body></html>
