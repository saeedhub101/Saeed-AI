<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saeed AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#character{position:absolute;inset:0;pointer-events:none}
#panel{position:absolute;left:10px;right:10px;bottom:10px;height:255px;background:rgba(18,20,28,.92);border:1px solid rgba(255,255,255,.14);border-radius:18px;color:#fff;display:flex;flex-direction:column;backdrop-filter:blur(16px);box-shadow:0 12px 40px #0008}
#panel.hidden{display:none}
header{height:42px;padding:8px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #ffffff12}
header strong{font-size:16px} header small{opacity:.65;margin-left:auto}
#controllerBox{position:absolute;left:14px;right:14px;top:14px;bottom:14px;background:#151822f5;border:1px solid #ffffff18;border-radius:16px;color:#fff;padding:14px;z-index:11;box-shadow:0 15px 50px #000b;overflow:auto}.ctrlGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ctrl{background:#ffffff08;border:1px solid #ffffff0d;border-radius:10px;padding:8px}.ctrl label{display:flex;justify-content:space-between;font-size:11px;opacity:.8}.ctrl input{width:100%}.ctrl h4{margin:0 0 6px;font-size:12px}.ctrlActions{display:flex;gap:7px;margin-top:10px}
button{border:0;border-radius:9px;padding:7px 10px;background:#ffffff12;color:#fff;cursor:pointer}button:hover{background:#ffffff20}
#messages{flex:1;overflow:auto;padding:9px 11px;font-size:13px}
.msg{padding:7px 10px;margin:5px 0;border-radius:11px;max-width:92%;white-space:pre-wrap;line-height:1.45}
.user{background:#315d9f;margin-left:auto}.assistant{background:#ffffff10}.tool{background:#a4771825;color:#ffd77a}
footer{display:flex;gap:7px;padding:8px;border-top:1px solid #ffffff12}
textarea{flex:1;resize:none;height:38px;border:1px solid #ffffff18;border-radius:10px;background:#0003;color:#fff;padding:9px;font:13px Segoe UI;outline:none}
#settingsBox,#confirm{position:absolute;left:14px;right:14px;top:14px;bottom:14px;background:#151822f5;border:1px solid #ffffff18;border-radius:16px;color:#fff;padding:16px;z-index:10;box-shadow:0 15px 50px #000b}
.hidden{display:none!important}.field{margin:8px 0}.field label{display:block;font-size:12px;opacity:.7;margin-bottom:4px}.field input{width:100%;padding:9px;border-radius:8px;border:1px solid #ffffff18;background:#0004;color:#fff}
#confirm{top:auto;bottom:20px;height:210px}.actions{display:flex;gap:8px;justify-content:flex-start;margin-top:12px}
#status{position:absolute;top:8px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 2px 7px #000;pointer-events:none;font-size:12px;opacity:.8}
</style>
</head>
<body>
<canvas id="avatar"></canvas><div id="character"></div><div id="status">سعيد جاهز</div>
<section id="panel" class="hidden">
<header><strong>سعيد</strong><small id="state">جاهز</small><button id="controllerBtn">🎛</button><button id="settingsBtn">⚙</button><button id="closeBtn">−</button></header>
<main id="messages"><div class="msg assistant">مرحبًا، أنا سعيد. اكتب لي ما تريد أن أفعله على الكمبيوتر.</div></main>
<footer><textarea id="input" placeholder="اكتب أمرك هنا..."></textarea><button id="send">إرسال</button></footer>
</section>
<section id="controllerBox" class="hidden">
<h3>Character Controller</h3>
<div class="ctrlGrid">
<div class="ctrl"><h4>العينان</h4><label>X <output id="eyeXv">0°</output></label><input id="eyeX" type="range" min="-15" max="15" step=".5" value="0"><label>Z <output id="eyeZv">0°</output></label><input id="eyeZ" type="range" min="-15" max="15" step=".5" value="0"></div>
<div class="ctrl"><h4>الرأس</h4><label>X <output id="headXv">0°</output></label><input id="headX" type="range" min="-15" max="15" step=".5" value="0"><label>Y <output id="headYv">0°</output></label><input id="headY" type="range" min="-15" max="15" step=".5" value="0"><label>Z <output id="headZv">0°</output></label><input id="headZ" type="range" min="-15" max="15" step=".5" value="0"></div>
<div class="ctrl"><h4>العمود الفقري</h4><label>X <output id="spineXv">0°</output></label><input id="spineX" type="range" min="-8" max="8" step=".5" value="0"><label>Y <output id="spineYv">0°</output></label><input id="spineY" type="range" min="-8" max="8" step=".5" value="0"><label>Z <output id="spineZv">0°</output></label><input id="spineZ" type="range" min="-8" max="8" step=".5" value="0"></div>
<div class="ctrl"><h4>الذراعان</h4><label>Left <output id="armLv">0°</output></label><input id="armL" type="range" min="-20" max="20" step=".5" value="0"><label>Right <output id="armRv">0°</output></label><input id="armR" type="range" min="-20" max="20" step=".5" value="0"></div>
<div class="ctrl"><h4>الرقبة والكتفان</h4><label>Neck X <output id="neckXv">0°</output></label><input id="neckX" type="range" min="-15" max="15" step=".5" value="0"><label>Neck Y <output id="neckYv">0°</output></label><input id="neckY" type="range" min="-15" max="15" step=".5" value="0"><label>Shoulder L/R <output id="shoulderLv">0°</output></label><input id="shoulderL" type="range" min="-15" max="15" step=".5" value="0"><label>Shoulder R/L <output id="shoulderRv">0°</output></label><input id="shoulderR" type="range" min="-15" max="15" step=".5" value="0"></div>
<div class="ctrl"><h4>اليد والمعصم</h4><label>Wrist L <output id="wristLv">0°</output></label><input id="wristL" type="range" min="-25" max="25" step=".5" value="0"><label>Wrist R <output id="wristRv">0°</output></label><input id="wristR" type="range" min="-25" max="25" step=".5" value="0"></div>
</div>
<div class="ctrlActions"><button id="breathBtn">التنفس: ON</button><button id="naturalBtn">الحركة الطبيعية: ON</button><button id="blinkBtn">الرمش التلقائي: ON</button><button id="eyesBtn">حركة العين: ON</button><button id="speechGestureBtn">إيماءات الكلام: ON</button><button id="resetController">إعادة الوضع الطبيعي</button><button id="controllerClose">إغلاق</button></div>
</section>
<section id="settingsBox" class="hidden">
<h3>إعدادات Saeed AI</h3>
<div class="field"><label>Provider</label><input id="provider" value="openrouter"></div>
<div class="field"><label>Base URL</label><input id="baseUrl" value="https://openrouter.ai/api/v1"></div>
<div class="field"><label>Model</label><input id="model" value="openai/gpt-5.1"></div>
<div class="field"><label>API Key</label><input id="key" type="password" placeholder="أدخل مفتاح API"></div>
<div class="actions"><button id="save">حفظ</button><button id="cancel">إلغاء</button></div>
</section>
<section id="confirm" class="hidden">
<h3>سعيد يطلب إذنك</h3><div id="confirmText"></div>
<div class="actions"><button id="approve">السماح</button><button id="deny">رفض</button></div>
</section>
<script type="module">
import * as THREE from './vendor/three.module.js';
import {GLTFLoader} from './vendor/GLTFLoader.js';

const $=id=>document.getElementById(id), messages=$('messages');
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.01,100);
camera.position.set(0,1.25,4.3);camera.lookAt(0,1.15,0);
const renderer=new THREE.WebGLRenderer({canvas:$('avatar'),alpha:true,antialias:true,premultipliedAlpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2.1));const keyLight=new THREE.DirectionalLight(0xffffff,2.5);keyLight.position.set(2,4,4);scene.add(keyLight);
let model,mixer,clock=new THREE.Clock(),bones={},base={},talking=false;
const facial={blink:0,smile:0,brow:0};
const facialTarget={blink:0,smile:0,brow:0};
const facialAuto={blink:0};
const facialProfiles={
 neutral:{blink:0,smile:0,brow:0},
 happy:{blink:0,smile:.8,brow:.25},
 sad:{blink:0,smile:0,brow:-.45},
 surprised:{blink:0,smile:.05,brow:.75},
 angry:{blink:0,smile:0,brow:-.75},
 thinking:{blink:0,smile:.05,brow:.2},
 greeting:{blink:0,smile:.3,brow:.3},
 speaking:{blink:0,smile:.08,brow:.05}
};
function setFacialTarget(values={}){
 for(const k of ['blink','smile','brow']) if(values[k]!==undefined) facialTarget[k]=k==='brow'
  ?THREE.MathUtils.clamp(Number(values[k])||0,-1,1)
  :THREE.MathUtils.clamp(Number(values[k])||0,0,1);
}
function setFacialEmotion(name='neutral',duration=280){
 const profile=facialProfiles[name]||facialProfiles.neutral;
 setFacialTarget(profile);
 facialEmotionUntil=performance.now()+Math.max(0,Number(duration)||0);
}
let facialEmotionUntil=0;

function findMorphTargets(){
  if(!model)return;
  model.traverse(o=>{
    if(!o.isMesh||!o.morphTargetDictionary)return;
    const d=o.morphTargetDictionary;
    for(const k of Object.keys(d)){const n=k.toLowerCase();
      if(n.includes('blink')||n.includes('eyeclose')) facial.blinkTargets=facial.blinkTargets||[],facial.blinkTargets.push([o,d[k]]);
      if(n.includes('smile')||n.includes('happy')) facial.smileTargets=facial.smileTargets||[],facial.smileTargets.push([o,d[k]]);
      if(n.includes('brow')||n.includes('eyebrow')) facial.browTargets=facial.browTargets||[],facial.browTargets.push([o,d[k]]);
    }
  });
}
function setMorph(list,v){if(!list)return;for(const [o,i] of list)o.morphTargetInfluences[i]=THREE.MathUtils.clamp(v,0,1)}
function updateFace(t){
  const k=.12;
  facial.blink=THREE.MathUtils.lerp(facial.blink,Math.max(facialTarget.blink,facialAuto.blink),k);
  facial.smile=THREE.MathUtils.lerp(facial.smile,facialTarget.smile,k);
  facial.brow=THREE.MathUtils.lerp(facial.brow,facialTarget.brow,k);
  if(!facial.blinkTargets&&!facial.smileTargets&&!facial.browTargets)return;
  setMorph(facial.blinkTargets,facial.blink);
  setMorph(facial.smileTargets,facial.smile);
  setMorph(facial.browTargets,(facial.brow+1)/2);
}
function bone(patterns){let f=null;model?.traverse(o=>{if(f||!o.isBone)return;let n=o.name.toLowerCase();if(patterns.some(p=>n.includes(p)))f=o});return f}
function mapBones(){
 bones.head=bone(['head']);
 bones.neck=bone(['neck','neck_01','neck1']);
 bones.spine=bone(['spine2','chest','upperchest','spine']);
 bones.ls=bone(['leftshoulder','shoulder_l','leftclavicle','clavicle_l']);
 bones.rs=bone(['rightshoulder','shoulder_r','rightclavicle','clavicle_r']);
 bones.lu=bone(['leftupperarm','leftarm','upperarm_l']);bones.ru=bone(['rightupperarm','rightarm','upperarm_r']);
 bones.lf=bone(['leftforearm','leftlowerarm','forearm_l']);bones.rf=bone(['rightforearm','rightlowerarm','forearm_r']);
 bones.lw=bone(['lefthand','hand_l','leftwrist','wrist_l']);bones.rw=bone(['righthand','hand_r','rightwrist','wrist_r']);
 bones.leftEye=bone(['left.eye','lefteye']);bones.rightEye=bone(['right.eye','righteye']);
 for(const [k,b] of Object.entries(bones))if(b)base[k]={x:b.rotation.x,y:b.rotation.y,z:b.rotation.z}
}
function rot(k,x=0,y=0,z=0){const b=bones[k],v=base[k];if(b&&v)b.rotation.set(v.x+x,v.y+y,v.z+z)}
const deg=d=>d*Math.PI/180;
class SaeedCharacterController{
 constructor(){
  this.state={eyes:{x:0,z:0},head:{x:0,y:0,z:0},neck:{x:0,y:0,z:0},spine:{x:0,y:0,z:0},shoulders:{left:0,right:0},arms:{left:0,right:0},forearms:{left:0,right:0},wrists:{left:0,right:0},breathing:true,talking:false,gesture:'idle',gestureUntil:0};
  this.offsets={head:{x:0,y:0,z:0},spine:{x:0,y:0,z:0},shoulders:{left:0,right:0}};
 }
 clamp(v,a,b){return THREE.MathUtils.clamp(Number(v)||0,a,b)}
 setEyes(x=0,z=0){this.state.eyes={x:this.clamp(x,-15,15),z:this.clamp(z,-15,15)};return {...this.state.eyes}}
 setHead(x=0,y=0,z=0){this.state.head={x:this.clamp(x,-15,15),y:this.clamp(y,-15,15),z:this.clamp(z,-15,15)};return {...this.state.head}}
 setNeck(x=0,y=0,z=0){this.state.neck={x:this.clamp(x,-15,15),y:this.clamp(y,-15,15),z:this.clamp(z,-15,15)};return {...this.state.neck}}
 setShoulders(left=0,right=0){this.state.shoulders={left:this.clamp(left,-15,15),right:this.clamp(right,-15,15)}}
 setWrists(left=0,right=0){this.state.wrists={left:this.clamp(left,-25,25),right:this.clamp(right,-25,25)}}
 setSpine(x=0,y=0,z=0){this.state.spine={x:this.clamp(x,-8,8),y:this.clamp(y,-8,8),z:this.clamp(z,-8,8)}}
 setArms(left=0,right=0,leftForearm=0,rightForearm=0){this.state.arms={left:this.clamp(left,-20,20),right:this.clamp(right,-20,20)};this.state.forearms={left:this.clamp(leftForearm,-25,25),right:this.clamp(rightForearm,-25,25)}}
 setBreathing(enabled=true){this.state.breathing=!!enabled}
 setTalking(enabled=true){this.state.talking=!!enabled;talking=!!enabled}
 gesture(name='idle',duration=900){const names=['idle','nod','wave','agree','disagree','think','greet'];this.state.gesture=names.includes(name)?name:'idle';this.state.gestureUntil=performance.now()+Math.max(100,Number(duration)||900)}
 reset(){this.state.eyes={x:0,z:0};this.state.head={x:0,y:0,z:0};this.state.neck={x:0,y:0,z:0};this.state.spine={x:0,y:0,z:0};this.state.shoulders={left:0,right:0};this.state.arms={left:0,right:0};this.state.forearms={left:0,right:0};this.state.wrists={left:0,right:0};this.state.gesture='idle';this.state.gestureUntil=0;this.offsets.head={x:0,y:0,z:0};this.offsets.spine={x:0,y:0,z:0};this.offsets.shoulders={left:0,right:0}}
 update(t){
  const s=this.state,active=performance.now()<s.gestureUntil,g=s.gesture;
  const breath=s.breathing?Math.sin(t*1.7)*.012:0,micro=Math.sin(t*.73)*.008,talk=s.talking;
  const nod=g==='nod'&&active?Math.sin(t*3.49)*.18:0,wave=g==='wave'&&active?Math.sin(t*8)*.16:0,agree=g==='agree'&&active?Math.sin(t*5)*.10:0,disagree=g==='disagree'&&active?Math.sin(t*5)*.10:0,think=g==='think'&&active?.08:0;
  const ex=behaviorController.enabled&&behaviorController.eyeSaccades?eyeCurrent.x:THREE.MathUtils.lerp(eyeCurrent.x,s.eyes.x,.12);
  const ez=behaviorController.enabled&&behaviorController.eyeSaccades?eyeCurrent.z:THREE.MathUtils.lerp(eyeCurrent.z,s.eyes.z,.12);
  if(!(behaviorController.enabled&&behaviorController.eyeSaccades))eyeCurrent={x:ex,z:ez};
  headCurrent.x=THREE.MathUtils.lerp(headCurrent.x,s.head.x,.12);headCurrent.y=THREE.MathUtils.lerp(headCurrent.y,s.head.y,.12);headCurrent.z=THREE.MathUtils.lerp(headCurrent.z,s.head.z,.12);
  rot('leftEye',deg(ex),0,deg(ez));rot('rightEye',deg(ex),0,deg(ez));
  rot('head',deg(headCurrent.x)+nod+micro+think+deg(this.offsets.head.x),deg(headCurrent.y)+disagree+deg(this.offsets.head.y),deg(headCurrent.z)+deg(this.offsets.head.z));
  rot('neck',deg(s.neck.x),deg(s.neck.y),deg(s.neck.z));
  rot('spine',deg(s.spine.x)+breath+deg(this.offsets.spine.x),deg(s.spine.y)+deg(this.offsets.spine.y),deg(s.spine.z)+deg(this.offsets.spine.z));
  rot('ls',deg(s.shoulders.left)+deg(this.offsets.shoulders.left)+Math.sin(t*1.15)*.015,0,0);rot('rs',deg(s.shoulders.right)+deg(this.offsets.shoulders.right)-Math.sin(t*1.05)*.015,0,0);
  rot('lu',deg(s.arms.left)+(talk?-.06:0)+wave+Math.sin(t*1.3)*.01,0,0);
  rot('ru',deg(s.arms.right)+(talk?.06:0)-wave-Math.sin(t*1.1)*.01,0,0);
  rot('lf',deg(s.forearms.left)+(talk?Math.sin(t*3.2)*.055:0)+agree,0,0);
  rot('rf',deg(s.forearms.right)+(talk?-Math.sin(t*3.2)*.055:0)-agree,0,0);
  rot('lw',deg(s.wrists.left),0,0);rot('rw',deg(s.wrists.right),0,0);
 }
}

// Natural behavior layer: additive offsets only; manual controller values remain authoritative.
class SaeedBehaviorController{
 constructor(){
  this.enabled=true;this.autoBlink=true;this.eyeSaccades=true;this.idleMotion=true;this.speechGestures=true;
  this.nextBlink=performance.now()+this.rand(1800,5200);this.blinking=false;this.blinkUntil=0;
  this.eyeTarget={x:0,z:0};this.nextEye=performance.now()+this.rand(900,2600);
  this.nextSpeechGesture=performance.now()+this.rand(1800,4200);
 }
 rand(a,b){return a+Math.random()*(b-a)}
 smooth(a,b,k){return a+(b-a)*k}
 update(now){
  if(!this.enabled)return;
  if(this.autoBlink){
   if(!this.blinking&&now>=this.nextBlink){this.blinking=true;this.blinkUntil=now+this.rand(110,210)}
   if(this.blinking){
    const mid=this.blinkUntil-120,p=THREE.MathUtils.clamp(1-Math.abs(now-mid)/90,0,1);
    facialAuto.blink=Math.max(facialAuto.blink,p);
    if(now>=this.blinkUntil){this.blinking=false;facial.blink=0;this.nextBlink=now+this.rand(2200,6500)}
   }
  }
  if(this.eyeSaccades){
   if(now>=this.nextEye){this.eyeTarget={x:this.rand(-8,8),z:this.rand(-6,6)};this.nextEye=now+this.rand(700,2800)}
   eyeCurrent.x=THREE.MathUtils.lerp(eyeCurrent.x,THREE.MathUtils.clamp(characterController.state.eyes.x+this.eyeTarget.x,-15,15),.055);
   eyeCurrent.z=THREE.MathUtils.lerp(eyeCurrent.z,THREE.MathUtils.clamp(characterController.state.eyes.z+this.eyeTarget.z,-15,15),.055);
  }
  if(this.idleMotion&&!characterController.state.talking&&characterController.state.gesture==='idle'){
   const sway=Math.sin(now*.00075)*.55;
   const breathe=Math.sin(now*.0017)*.35;
   const o=characterController.offsets;
   o.head.x=breathe*.035;o.head.z=sway*.025;
   o.spine.z=sway*.012;
   o.shoulders.left=sway*.08;o.shoulders.right=-sway*.08;
  }
  if(!this.idleMotion){
   const o=characterController.offsets;o.head.x=o.head.y=o.head.z=0;o.spine.x=o.spine.y=o.spine.z=0;o.shoulders.left=o.shoulders.right=0;
  }
  if(this.speechGestures&&characterController.state.talking&&now>=this.nextSpeechGesture&&characterController.state.gesture==='idle'){
   const gs=['nod','agree','think'];characterController.gesture(gs[Math.floor(Math.random()*gs.length)],this.rand(550,1100));
   this.nextSpeechGesture=now+this.rand(2800,6200);
  }
 }
}
const behaviorController=new SaeedBehaviorController();
try{
 const saved=JSON.parse(localStorage.getItem('saeed.behavior')||'null');
 if(saved){Object.assign(behaviorController,{enabled:saved.enabled!==false,autoBlink:saved.autoBlink!==false,eyeSaccades:saved.eyeSaccades!==false,speechGestures:saved.speechGestures!==false});}
}catch{}
function saveBehavior(){try{localStorage.setItem('saeed.behavior',JSON.stringify({enabled:behaviorController.enabled,autoBlink:behaviorController.autoBlink,eyeSaccades:behaviorController.eyeSaccades,speechGestures:behaviorController.speechGestures}))}catch{}}
window.SaeedBehaviorController=behaviorController;
const characterController=new SaeedCharacterController();
window.SaeedCharacterController=characterController;
let eyeCurrent={x:0,z:0},headCurrent={x:0,y:0,z:0};
new GLTFLoader().load('./saeed.ai.glb',g=>{
 model=g.scene;scene.add(model);model.position.y=-1.12;model.scale.setScalar(1);mapBones();findMorphTargets();
 if(g.animations?.length){mixer=new THREE.AnimationMixer(model);let idle=g.animations.find(a=>/idle|stand|breath/i.test(a.name))||g.animations[0];mixer.clipAction(idle).play()}
},undefined,e=>{$('status').textContent='تعذر تحميل الشخصية';console.error(e)});
function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
function speak(text){if(!speechSynthesis)return; speechSynthesis.cancel();characterController.setTalking(false);const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.98;u.pitch=1;u.onstart=()=>{characterController.setTalking(true);$('state').textContent='يتحدث';$('status').textContent='سعيد يتحدث'};u.onend=()=>{characterController.setTalking(false);$('state').textContent='جاهز';$('status').textContent='سعيد جاهز'};speechSynthesis.speak(u)}
function send(){const t=$('input').value.trim();if(!t)return;$('input').value='';add('user',t);$('state').textContent='يفكر';$('status').textContent='سعيد يفكر';chrome.webview.postMessage({type:'chat',text:t})}
$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('controllerBtn').onclick=()=>{$('controllerBox').classList.remove('hidden');$('panel').classList.add('hidden');
 $('naturalBtn').textContent='الحركة الطبيعية: '+(behaviorController.enabled?'ON':'OFF');
 $('blinkBtn').textContent='الرمش التلقائي: '+(behaviorController.autoBlink?'ON':'OFF');
 $('eyesBtn').textContent='حركة العين: '+(behaviorController.eyeSaccades?'ON':'OFF');
 $('speechGestureBtn').textContent='إيماءات الكلام: '+(behaviorController.speechGestures?'ON':'OFF');
};
$('controllerClose').onclick=()=>{$('controllerBox').classList.add('hidden')};
function bindRange(id,out,fn){const el=$(id),o=$(out);const apply=()=>{o.textContent=el.value+'°';fn()};el.oninput=apply;apply()}
function applyController(){characterController.setEyes($('eyeX').value,$('eyeZ').value);characterController.setHead($('headX').value,$('headY').value,$('headZ').value);characterController.setSpine($('spineX').value,$('spineY').value,$('spineZ').value);characterController.setArms($('armL').value,$('armR').value,0,0);characterController.setNeck($('neckX').value,$('neckY').value,0);characterController.setShoulders($('shoulderL').value,$('shoulderR').value);characterController.setWrists($('wristL').value,$('wristR').value)}
['eyeX','eyeZ','headX','headY','headZ','spineX','spineY','spineZ','armL','armR','neckX','neckY','shoulderL','shoulderR','wristL','wristR'].forEach(id=>$(id).oninput=()=>{const o=$(id+'v');if(o)o.textContent=$(id).value+'°';applyController()});
$('breathBtn').onclick=()=>{characterController.setBreathing(!characterController.state.breathing);$('breathBtn').textContent='التنفس: '+(characterController.state.breathing?'ON':'OFF')};
$('naturalBtn').onclick=()=>{behaviorController.enabled=!behaviorController.enabled;$('naturalBtn').textContent='الحركة الطبيعية: '+(behaviorController.enabled?'ON':'OFF');saveBehavior()};
$('blinkBtn').onclick=()=>{behaviorController.autoBlink=!behaviorController.autoBlink;$('blinkBtn').textContent='الرمش التلقائي: '+(behaviorController.autoBlink?'ON':'OFF');if(!behaviorController.autoBlink)facialAuto.blink=0;saveBehavior()};
$('eyesBtn').onclick=()=>{behaviorController.eyeSaccades=!behaviorController.eyeSaccades;$('eyesBtn').textContent='حركة العين: '+(behaviorController.eyeSaccades?'ON':'OFF');saveBehavior()};
$('speechGestureBtn').onclick=()=>{behaviorController.speechGestures=!behaviorController.speechGestures;$('speechGestureBtn').textContent='إيماءات الكلام: '+(behaviorController.speechGestures?'ON':'OFF');saveBehavior()};
$('resetController').onclick=()=>{characterController.reset();setFacialEmotion('neutral',0);setFacialTarget({blink:0,smile:0,brow:0});facialAuto.blink=0;['eyeX','eyeZ','headX','headY','headZ','spineX','spineY','spineZ','armL','armR','neckX','neckY','shoulderL','shoulderR','wristL','wristR'].forEach(id=>$(id).value=0);['eyeXv','eyeZv','headXv','headYv','headZv','spineXv','spineYv','spineZv','armLv','armRv','neckXv','neckYv','shoulderLv','shoulderRv','wristLv','wristRv'].forEach(id=>$(id).textContent='0°')};

$('settingsBtn').onclick=()=>{$('settingsBox').classList.remove('hidden');$('panel').classList.add('hidden')};
$('closeBtn').onclick=()=>{$('panel').classList.add('hidden')};
$('cancel').onclick=()=>{$('settingsBox').classList.add('hidden')};
$('save').onclick=()=>{chrome.webview.postMessage({type:'settings',provider:$('provider').value,baseUrl:$('baseUrl').value,model:$('model').value,apiKey:$('key').value});$('settingsBox').classList.add('hidden')};
let confirmId='';
$('approve').onclick=()=>{chrome.webview.postMessage({type:'confirm',id:confirmId,approved:true});$('confirm').classList.add('hidden')};
$('deny').onclick=()=>{chrome.webview.postMessage({type:'confirm',id:confirmId,approved:false});$('confirm').classList.add('hidden')};
chrome.webview.addEventListener('message',e=>{
 let d=e.data;try{if(typeof d==='string')d=JSON.parse(d)}catch{}
 if(!d)return;
 if(d.type==='answer'){add('assistant',d.text||'');$('state').textContent='يتحدث';speak(d.text||'')}
 if(d.type==='error'){add('tool','خطأ: '+(d.text||''));$('state').textContent='جاهز';$('status').textContent='سعيد جاهز';characterController.setTalking(false)}
 if(d.type==='status'){$('state').textContent=d.text||'يفكر';$('status').textContent='سعيد يعمل'}
 if(d.type==='tool')add('tool','تنفيذ: '+d.name)
 if(d.type==='confirm'){confirmId=d.id;$('confirmText').textContent='يريد تنفيذ: '+d.name+'\n'+JSON.stringify(d.args||{},null,2);$('confirm').classList.remove('hidden');$('panel').classList.remove('hidden')}
 if(d.type==='character'){
   if(d.action==='eye_rotation')characterController.setEyes(d.x,d.z);
   else if(d.action==='head_rotation')characterController.setHead(d.x,d.y,d.z);
   else if(d.action==='spine')characterController.setSpine(d.x,d.y,d.z);
   else if(d.action==='neck')characterController.setNeck(d.x,d.y,d.z);
   else if(d.action==='shoulders')characterController.setShoulders(d.left,d.right);
   else if(d.action==='wrists')characterController.setWrists(d.left,d.right);
   else if(d.action==='face'){setFacialTarget({blink:d.blink,smile:d.smile,brow:d.brow})}
   else if(d.action==='emotion'){setFacialEmotion(d.emotion||'neutral',d.duration||280)}
   else if(d.action==='blink'){facialAuto.blink=1;setTimeout(()=>facialAuto.blink=0,Math.max(80,Number(d.duration)||140))}
   else if(d.action==='arms')characterController.setArms(d.left,d.right,d.leftForearm,d.rightForearm);
   else if(d.action==='gesture')characterController.gesture(d.gesture,d.duration);
   else if(d.action==='breathing')characterController.setBreathing(d.enabled);
   else if(d.action==='talking')characterController.setTalking(d.enabled);
   else if(d.action==='behavior'){
     behaviorController.enabled=d.enabled!==false;
     behaviorController.autoBlink=d.autoBlink!==false;
     behaviorController.eyeSaccades=d.eyeSaccades!==false;
     behaviorController.speechGestures=d.speechGestures!==false;
     if(!behaviorController.autoBlink)facial.blink=0;
   }
   else if(d.action==='reset'){characterController.reset();setFacialTarget({blink:0,smile:0,brow:0});facialAuto.blink=0;eyeCurrent={x:0,z:0};headCurrent={x:0,y:0,z:0};}
 }
});
$('character').addEventListener('dblclick',()=>{$('panel').classList.toggle('hidden')});
function frame(){
 requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),t=performance.now()/1000,now=performance.now();
 if(mixer)mixer.update(dt);behaviorController.update(now);updateFace(t);
 if(model){characterController.update(t);model.position.y=-1.12+(characterController.state.breathing?Math.sin(t*1.8)*.012:0)}
 renderer.render(scene,camera)
}
frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
