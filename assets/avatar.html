<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saeed AI</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
canvas{display:block;width:100%;height:100%}
#status{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:13px Arial;color:#fff;text-shadow:0 2px 5px #000;pointer-events:none}
#error{position:absolute;left:8px;right:8px;top:8px;color:#fff;background:#7b1e1eaa;padding:8px;border-radius:8px;font:12px Arial;display:none}
</style>
</head>
<body>
<div id="error"></div>
<div id="status">Saeed AI</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const status=document.getElementById('status'), error=document.getElementById('error');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.01,100);
camera.position.set(0,1.35,4.2);
camera.lookAt(0,1.15,0);

const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,premultipliedAlpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.4); key.position.set(2,4,4); scene.add(key);

let model=null, mixer=null, clock=new THREE.Clock();
const bones={};

function findBone(patterns){
  if(!model)return null;
  let found=null;
  model.traverse(o=>{
    if(found||!o.isBone)return;
    const n=o.name.toLowerCase();
    if(patterns.some(p=>p.test(n)))found=o;
  });
  return found;
}

function cacheBones(){
  bones.head=findBone([/head/,/neck/]);
  bones.leftUpperArm=findBone([/left.*upper.?arm/,/upper.?arm.*left/,/l.?upper.?arm/]);
  bones.rightUpperArm=findBone([/right.*upper.?arm/,/upper.?arm.*right/,/r.?upper.?arm/]);
  bones.leftForeArm=findBone([/left.*forearm/,/left.*lower.?arm/,/forearm.*left/,/l.?forearm/]);
  bones.rightForeArm=findBone([/right.*forearm/,/right.*lower.?arm/,/forearm.*right/,/r.?forearm/]);
  bones.spine=findBone([/^spine$/, /spine1/, /chest/, /upperchest/]);
}

function restPose(){
  if(!model)return;
  model.rotation.y=0;
  model.position.y=-1.18;
  model.scale.setScalar(1.0);
}

new GLTFLoader().load(
  'https://raw.githubusercontent.com/saeedhub101/saeed-assistant-preview/main/saeed.ai.glb',
  gltf=>{
    model=gltf.scene;
    scene.add(model);
    restPose();
    cacheBones();
    if(gltf.animations?.length){
      mixer=new THREE.AnimationMixer(model);
      const idle=gltf.animations.find(a=>/idle|breath|stand/i.test(a.name))||gltf.animations[0];
      mixer.clipAction(idle).play();
    }
    status.textContent='Saeed AI';
  },
  undefined,
  e=>{error.style.display='block';error.textContent='Could not load Saeed avatar: '+(e?.message||e);}
);

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime(), dt=Math.min(clock.getDelta(),.05);
  if(mixer)mixer.update(dt);

  if(model){
    // Subtle natural idle motion; animation clips, when present, remain active.
    const talking=Math.sin(t*10)>0.25;
    if(bones.head){
      bones.head.rotation.y += Math.sin(t*.75)*.0025;
      bones.head.rotation.x += Math.sin(t*1.1)*.0015;
    }
    if(bones.spine) bones.spine.rotation.z += Math.sin(t*1.2)*.0015;
    if(bones.leftUpperArm) bones.leftUpperArm.rotation.z += Math.sin(t*.9)*.003;
    if(bones.rightUpperArm) bones.rightUpperArm.rotation.z -= Math.sin(t*.9+.8)*.003;
    if(talking && bones.rightForeArm) bones.rightForeArm.rotation.x += Math.sin(t*5)*.006;
  }
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
