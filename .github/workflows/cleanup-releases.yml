name: Repository Release Cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup-releases.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the latest official release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_TAG: v2.0-build.34
        run: |
          set -e
          releases="$(gh api --paginate "/repos/${REPO}/releases?per_page=100" --jq '.[] | [.id,.tag_name] | @tsv')"
          while IFS=$'\t' read -r id tag; do
            [ -z "${id}" ] && continue
            if [ "${tag}" != "${KEEP_TAG}" ]; then
              gh api --method DELETE "/repos/${REPO}/releases/${id}"
            fi
          done <<< "${releases}"

          tags="$(gh api --paginate "/repos/${REPO}/git/refs/tags" --jq '.[].ref' 2>/dev/null || true)"
          while read -r ref; do
            [ -z "${ref}" ] && continue
            tag="${ref#refs/tags/}"
            if [ "${tag}" != "${KEEP_TAG}" ]; then
              gh api --method DELETE "/repos/${REPO}/git/refs/tags/${tag}"
            fi
          done <<< "${tags}"

      - name: Remove this temporary cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha="$(gh api "/repos/${REPO}/contents/.github/workflows/cleanup-releases.yml" --jq '.sha')"
          gh api --method DELETE "/repos/${REPO}/contents/.github/workflows/cleanup-releases.yml"             -f message="Remove temporary release cleanup workflow"             -f sha="${sha}"             -f branch="main"
