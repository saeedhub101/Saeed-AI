name: Saeed AI — Windows Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'VERSION'
      - '.github/workflows/build-windows-electron.yml'
      - 'BUILD_RULES.md'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release for the VERSION in this commit'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: saeed-windows-build-main
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Restore canonical Saeed GLB
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/saeedhub101/saeed-assistant-preview/main/saeed.ai.glb"
          Invoke-WebRequest -Uri $url -OutFile "assets/Saeed_AI-3D.glb"
          $item = Get-Item "assets/Saeed_AI-3D.glb"
          if ($item.Length -lt 60000000) { throw "Canonical Saeed GLB is unexpectedly small: $($item.Length) bytes" }
          $bytes = [System.IO.File]::ReadAllBytes($item.FullName)
          $magic = [System.Text.Encoding]::ASCII.GetString($bytes[0..3])
          if ($magic -ne "glTF") { throw "Canonical Saeed GLB has an invalid GLB header: $magic" }
          Write-Host "Canonical Saeed GLB restored: $($item.Length) bytes"

      - name: Validate version identity
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if ($releaseVersion -notmatch '^\d+\.\d+$') { throw "VERSION must be MAJOR.MINOR, found: $releaseVersion" }
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "$releaseVersion.0") {
            throw "package.json version $($pkg.version) does not match VERSION $releaseVersion (expected $releaseVersion.0)"
          }
          if ($pkg.build.buildVersion -ne $pkg.version) { throw "Electron buildVersion must equal package.json version" }
          if ($pkg.build.win.icon -ne "saeed.png") { throw "Windows icon must be assets/saeed.png" }
          Write-Host "Official product version: v$releaseVersion"
          Write-Host "Workflow build number: $env:GITHUB_RUN_NUMBER"

      - name: Validate repository structure
        shell: pwsh
        run: |
          $required = @("package.json","VERSION","src/main.js","src/preload.js","src/renderer.js","src/avatar.js","src/agent.js","src/realtime.js","src/tools.js","assets/Saeed_AI-3D.glb","assets/saeed.png")
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Required project file is missing: $path" }
          }

      - name: Validate pinned direct dependencies
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $expected = @{
            "three" = "0.180.0"
            "ws" = "8.18.3"
            "electron" = "38.8.6"
            "electron-builder" = "26.15.3"
          }
          foreach ($name in $expected.Keys) {
            $actual = if ($pkg.dependencies.$name) { $pkg.dependencies.$name } else { $pkg.devDependencies.$name }
            if ($actual -ne $expected[$name]) { throw "$name is not pinned to $($expected[$name]); found $actual" }
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static JavaScript validation
        run: npm test

      - name: Validate microphone mode contract
        shell: pwsh
        run: |
          $agent = Get-Content "src/agent.js" -Raw
          $renderer = Get-Content "src/renderer.js" -Raw
          $main = Get-Content "src/main.js" -Raw
          foreach ($source in @($agent,$renderer,$main)) {
            if ($source -notmatch "alwaysListening") { throw "Microphone persistence contract missing" }
            if ($source -notmatch "micMode") { throw "Microphone mode contract missing" }
          }
          if ($renderer -notmatch 'micMode.*off') { throw "Microphone OFF path missing" }
          if ($renderer -notmatch 'micMode.*always') { throw "Always Listening restore path missing" }
          if ($main -notmatch 'stopRealtime\(\)') { throw "Main-process microphone stop path missing" }

      - name: Validate application icon
        shell: pwsh
        run: |
          $icon = "assets/saeed.png"
          if (-not (Test-Path $icon -PathType Leaf)) { throw "Required application icon is missing: $icon" }
          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Image]::FromFile((Resolve-Path $icon))
          try {
            if ($img.Width -lt 256 -or $img.Height -lt 256) { throw "saeed.png must be at least 256x256 pixels; found $($img.Width)x$($img.Height)" }
            Write-Host "Application icon validated: $($img.Width)x$($img.Height)"
          } finally { $img.Dispose() }

      - name: Enforce GLB/Three.js architecture
        shell: pwsh
        run: |
          $avatar = Get-Content "src/avatar.js" -Raw
          if ($avatar -notmatch "GLTFLoader") { throw "GLB/Three.js loader contract missing" }
          if ($avatar -match "VRM") { throw "VRM architecture detected; Saeed must remain GLB/Three.js" }
          if ($avatar -notmatch "Saeed_AI-3D\.glb") { throw "Production avatar path is not Saeed_AI-3D.glb" }

      - name: Build Windows installer
        run: npm run build

      - name: Verify release output
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if (-not (Test-Path "dist" -PathType Container)) { throw "dist directory was not created" }
          $installers = @(Get-ChildItem "dist" -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*uninstaller*" })
          if ($installers.Count -ne 1) { throw "Expected exactly one installer EXE, found $($installers.Count)" }
          $installer = $installers[0]
          $expectedName = "Saeed.AI.Setup.$releaseVersion.0.exe"
          if ($installer.Name -ne $expectedName) { throw "Installer version mismatch: expected $expectedName, found $($installer.Name)" }
          if ($installer.Length -lt 10000000) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          $blockmaps = @(Get-ChildItem "dist" -Filter "*.blockmap" -File)
          if ($blockmaps.Count -lt 1) { throw "Installer blockmap is missing" }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$sha  $($installer.Name)" | Set-Content "dist/Saeed-AI-Setup-x64.exe.sha256"
          Write-Host "Verified installer: $($installer.Name)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA256: $sha"

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-AI-windows-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.sha256

      - name: Publish official release only when explicitly requested
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to create a duplicate."
            exit 1
          fi
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/*.sha256 \
            --title "Saeed AI ${VERSION}" \
            --notes "Official Windows Electron release. Commit: ${{ github.sha }}. Workflow Build: ${{ github.run_number }}." \
            --target "${{ github.sha }}"
