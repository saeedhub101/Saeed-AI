name: Saeed AI — Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release only after this build passes all validation and smoke tests'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: saeed-windows-build-main
  cancel-in-progress: false
jobs:
  build:
    name: Test and build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Validate version identity
        shell: pwsh
        run: |
          $releaseVersion=(Get-Content "VERSION" -Raw).Trim(); if ($releaseVersion -notmatch '^\d+\.\d+$') { throw "VERSION must be MAJOR.MINOR" }; $pkg=Get-Content "package.json" -Raw | ConvertFrom-Json; if ($pkg.version -ne "$releaseVersion.0") { throw "package.json version mismatch" }; if ($pkg.build.buildVersion -ne $pkg.version) { throw "Electron buildVersion mismatch" }
      - name: Validate repository structure
        shell: pwsh
        run: |
          $required=@("package.json","VERSION","src/main.js","src/character-preload.js","src/chat.html","src/chat.css","src/chat.js","src/settings-new.html","src/settings-new.css","src/settings-new.js","src/preload.js","src/agent.js","src/realtime.js","src/tools.js","assets/Saeed_AI-3D.glb","assets/saeed.png"); foreach($path in $required){if(-not(Test-Path $path -PathType Leaf)){throw "Required project file is missing: $path"}}
      - name: Validate pinned direct dependencies
        shell: pwsh
        run: |
          $pkg=Get-Content "package.json" -Raw|ConvertFrom-Json; $expected=@{"ws"="8.18.3";"electron"="38.8.6";"electron-builder"="26.15.3";"three"="0.186.1"}; foreach($name in $expected.Keys){$actual=if($pkg.dependencies.$name){$pkg.dependencies.$name}else{$pkg.devDependencies.$name};if($actual-ne$expected[$name]){throw "$name dependency mismatch"}}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static JavaScript validation
        run: npm test
      - name: Validate product architecture and 3D contract
        shell: pwsh
        run: |
          $main=Get-Content "src/main.js" -Raw;$charPreload=Get-Content "src/character-preload.js" -Raw;$chat=Get-Content "src/chat.js" -Raw;$preload=Get-Content "src/preload.js" -Raw;$agent=Get-Content "src/agent.js" -Raw;$pkg=Get-Content "package.json" -Raw|ConvertFrom-Json; if($main-notmatch"characterWin=new BrowserWindow"){throw "Character window contract missing"};if($main-notmatch"skipTaskbar:true"){throw "Character taskbar contract missing"};if($charPreload-notmatch"GLTFLoader"){throw "GLTFLoader missing"};if($charPreload-notmatch"Saeed_AI-3D\.glb"){throw "GLB contract missing"};if($charPreload-notmatch"saeedWebglReady"){throw "WebGL marker missing"};if($charPreload-notmatch"saeedGltfReady"){throw "GLB marker missing"};if($chat-notmatch"deleteChat"){throw "Chat delete missing"};if($chat-notmatch"navigator\.clipboard"){throw "Chat copy missing"};if($preload-notmatch"deleteChat:"){throw "Delete IPC missing"};if($agent-notmatch"deleteConversation"){throw "Conversation delete missing"};if($main-notmatch"chat:show"){throw "Chat IPC missing"};if($main-notmatch"realtimeApiKey"){throw "API contract missing"};if(-not$pkg.build.extraResources){throw "extraResources missing"}
      - name: Validate microphone controls
        shell: pwsh
        run: |
          $agent=Get-Content "src/agent.js" -Raw;$main=Get-Content "src/main.js" -Raw;$chat=Get-Content "src/chat.js" -Raw;$charPreload=Get-Content "src/character-preload.js" -Raw;foreach($x in @("alwaysListening","modeAlways","modePush","modeOff","newChatSide","setAppDetails","getUserMedia","sendRealtimeAudio","saeed.ico","character:move-by")){if(($agent+$main+$chat+$charPreload)-notmatch[regex]::Escape($x)){throw "Microphone/application contract missing: $x"}}
      - name: Prepare native Windows icon
        shell: pwsh
        run: |
          $source="assets/saeed.png";$icon="assets/saeed.ico";if(!(Test-Path$source)){throw "Source PNG missing"};if(!(Get-Command magick-ErrorAction SilentlyContinue)){choco install imagemagick --yes --no-progress};&magick$source-background none-define icon:auto-resize=256,128,64,48,32,16$icon;if($LASTEXITCODE-ne0){throw "ImageMagick failed"};if(!(Test-Path$icon)){throw "ICO missing"}
      - name: Build Windows installer
        run: npm run build
      - name: Verify release output
        shell: pwsh
        run: |
          $releaseVersion=(Get-Content "VERSION" -Raw).Trim();if(-not(Test-Path"dist")){throw "dist missing"};$installers=@(Get-ChildItem"dist"-Filter"*.exe"-File|Where-Object{$_.Name-notlike"*uninstaller*"});if($installers.Count-ne1){throw "Expected one installer"};$installer=$installers[0];$expectedName="Saeed.AI.Setup.$releaseVersion.0.exe";if($installer.Name-ne$expectedName){throw "Installer version mismatch"};if($installer.Length-lt10000000){throw "Installer too small"};$blockmaps=@(Get-ChildItem"dist"-Filter"*.blockmap"-File);if($blockmaps.Count-lt1){throw "Blockmap missing"};$sha=(Get-FileHash$installer.FullName-Algorithm SHA256).Hash;"$sha  $($installer.Name)"|Set-Content"dist/Saeed-AI-Setup-x64.exe.sha256"
      - name: Validate packaged API and microphone contracts
        shell: pwsh
        run: |
          $src=Get-Content "src/agent.js" -Raw;$rt=Get-Content "src/realtime.js" -Raw;$chat=Get-Content "src/chat.js" -Raw;if($src-notmatch'fetch\(base\+"/chat/completions"'){throw "LLM API path missing"};if($rt-notmatch"gpt-realtime-2.1"){throw "Realtime model missing"};if($chat-notmatch"navigator\.mediaDevices\.getUserMedia"){throw "getUserMedia missing"};if($chat-notmatch"24000"){throw "24kHz path missing"}
      - name: Install packaged application for runtime testing
        shell: pwsh
        run: |
          $installDir=Join-Path$env:RUNNER_TEMP"SaeedAI-Installed";if(Test-Path$installDir){Remove-Item$installDir-Recurse-Force};$installer=@(Get-ChildItem"dist"-Filter"*.exe"-File|Where-Object{$_.Name-notlike"*uninstaller*"})[0];$p=Start-Process$installer.FullName-ArgumentList @("/S","/D=$installDir")-Wait-PassThru;if($p.ExitCode-ne0){throw "Installer failed"};$exe=@(Get-ChildItem$installDir-Recurse-Filter"Saeed AI.exe"-File);if($exe.Count-ne1){throw "Packaged EXE missing"};$exe[0].FullName|Set-Content"$env:RUNNER_TEMP\saeed-exe-path.txt"
      - name: Launch and run Windows application end-to-end smoke test
        continue-on-error: true
        shell: pwsh
        run: |
          $exe=(Get-Content "$env:RUNNER_TEMP\saeed-exe-path.txt"-Raw).Trim();node"tools/windows-runtime-smoke.cjs"$exe;$failed=$LASTEXITCODE;if(Test-Path"saeed-e2e-stdout.log"){Get-Content"saeed-e2e-stdout.log"};if(Test-Path"saeed-e2e-stderr.log"){Get-Content"saeed-e2e-stderr.log"};if($failed-ne0){Write-Warning "Runtime smoke failed with exit code $failed; continuing to collect diagnostic resource metrics."}
      - name: Measure packaged idle CPU RAM and GPU usage
        shell: pwsh
        run: |
          $exe=(Get-Content "$env:RUNNER_TEMP\saeed-exe-path.txt"-Raw).Trim();$env:SAEED_EXE_PATH=$exe;powershell-NoProfile-ExecutionPolicy Bypass-File"tools/windows-resource-smoke.ps1"-Seconds10;if(-not(Test-Path"saeed-resource-metrics.json")){throw "Resource metrics were not produced"};Get-Content"saeed-resource-metrics.json"
      - name: Verify clean shutdown and no orphan Saeed process
        shell: pwsh
        run: |
          $names=@("Saeed AI","SaeedAI","Saeed");Start-Sleep-Seconds2;$left=@(Get-Process-ErrorAction SilentlyContinue|Where-Object{$names-contains$_.ProcessName});if($left.Count-gt0){throw "Saeed process remained after runtime test"}
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-AI-runtime-diagnostics-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            saeed-e2e-stdout.log
            saeed-e2e-stderr.log
            saeed-resource-metrics.json
            ${{ runner.temp }}/saeed-exe-path.txt
      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-AI-windows-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.sha256
      - name: Publish official release after the full gate
        if: false
        run: echo "No release for diagnostic build"
