name: Build Experimental - Native WebGPU Dawn + D3D12
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-experimental-dawn-d3d12.yml"
permissions:
  contents: read
jobs:
  dawn-d3d12:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Dawn
        shell: pwsh
        run: git clone --depth 1 --recurse-submodules https://dawn.googlesource.com/dawn.git third_party/dawn
      - name: Configure Dawn for D3D12
        shell: pwsh
        run: |
          cmake -S third_party/dawn -B build-dawn -G "Visual Studio 17 2022" -A x64 `
            -DDAWN_ENABLE_D3D12=ON `
            -DDAWN_ENABLE_D3D11=OFF `
            -DDAWN_ENABLE_VULKAN=OFF `
            -DDAWN_ENABLE_DESKTOP_GL=OFF `
            -DDAWN_ENABLE_OPENGLES=OFF `
            -DDAWN_BUILD_SAMPLES=OFF `
            -DDAWN_BUILD_TESTS=OFF `
            -DDAWN_ENABLE_INSTALL=ON
      - name: Build Dawn WebGPU native library
        shell: pwsh
        run: cmake --build build-dawn --config Release --target webgpu_dawn -- /m:2
      - name: Verify D3D12 Dawn build
        shell: pwsh
        run: |
          $files=Get-ChildItem build-dawn -Recurse -File | Where-Object { $_.Name -match "webgpu_dawn.*\.(lib|dll)$" }
          if(!$files){throw "webgpu_dawn artifact not found"}
          Write-Host "DAWN_D3D12_BUILD_OK"
      - name: Upload Dawn build
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Experimental-Dawn-D3D12-${{ github.run_number }}
          path: build-dawn/**/Release/*
          if-no-files-found: error
