name: Build Experimental - Native bgfx
# Real shader compiler verification for the bgfx experiment
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-experimental-bgfx.yml"
      - "renderer_lab/shaders/**"
permissions:
  contents: read
jobs:
  bgfx:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bgfx
        shell: pwsh
        run: git clone --depth 1 --recurse-submodules https://github.com/bkaradzic/bgfx.cmake.git third_party/bgfx-cmake
      - name: Configure bgfx shader compiler
        shell: pwsh
        run: |
          cmake -S third_party/bgfx-cmake -B build-bgfx -G "Visual Studio 17 2022" -A x64 `
            -DBGFX_BUILD_TOOLS=ON `
            -DBGFX_BUILD_TOOLS_SHADER=ON `
            -DBGFX_BUILD_TOOLS_TEXTURE=OFF `
            -DBGFX_BUILD_TOOLS_GEOMETRY=OFF `
            -DBGFX_BUILD_EXAMPLES=OFF
      - name: Build bgfx shader compiler
        shell: pwsh
        run: cmake --build build-bgfx --config Release --target shaderc -- /m:2
      - name: Compile real bgfx shaders
        shell: pwsh
        run: |
          $shaderc=(Get-ChildItem -Path build-bgfx -Filter shaderc.exe -Recurse | Select-Object -First 1).FullName
          if(!$shaderc){throw "shaderc.exe not found"}
          $inc=(Resolve-Path third_party/bgfx-cmake/bgfx/src).Path
          New-Item -ItemType Directory -Force renderer_lab/shaders | Out-Null
          & $shaderc -f renderer_lab/shaders/vs_model.sc -o renderer_lab/shaders/vs_model.bin --type v --platform windows --profile s_5_0 -i $inc --varyingdef renderer_lab/shaders/varying.def.sc
          if($LASTEXITCODE -ne 0){throw "bgfx vertex shader compilation failed"}
          & $shaderc -f renderer_lab/shaders/fs_model.sc -o renderer_lab/shaders/fs_model.bin --type f --platform windows --profile s_5_0 -i $inc --varyingdef renderer_lab/shaders/varying.def.sc
          if($LASTEXITCODE -ne 0){throw "bgfx fragment shader compilation failed"}
          if(!(Test-Path renderer_lab/shaders/vs_model.bin)){throw "vertex shader binary missing"}
          if(!(Test-Path renderer_lab/shaders/fs_model.bin)){throw "fragment shader binary missing"}
      - name: Upload bgfx build probe
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Experimental-bgfx-${{ github.run_number }}
          path: |
            renderer_lab/shaders/vs_model.bin
            renderer_lab/shaders/fs_model.bin
