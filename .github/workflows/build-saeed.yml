name: Build Saeed AI Desktop

concurrency:
  group: saeed-production-build
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: npm test
      - name: Build Windows installer
        run: npm run build:win
      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $asar = "dist/win-unpacked/resources/app.asar"
          if (!(Test-Path $asar)) { throw "Packaged app.asar was not produced: $asar" }
          $entries = npx --yes asar list $asar
          $required = @(
            "assets/Saeed_AI-3D.glb",
            "src/index.html",
            "src/avatar.js",
            "node_modules/three/build/three.module.js",
            "node_modules/three/examples/jsm/loaders/GLTFLoader.js"
          )
          foreach ($item in $required) {
            if (-not ($entries -contains $item)) { throw "Packaged runtime is missing: $item" }
            Write-Host "Packaged runtime OK: $item"
          }
          Write-Host "Packaged app.asar verified."

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "dist/Saeed-AI-Setup-x64.exe"
          if (!(Test-Path $installer)) { throw "Installer was not produced: $installer" }
          $size=(Get-Item $installer).Length
          if ($size -lt 10000000) { throw "Installer is unexpectedly small: $size bytes" }
          Write-Host "Saeed installer verified: $installer ($size bytes)"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-AI-Windows-x64-${{ github.run_number }}
          path: dist/Saeed-AI-Setup-x64.exe
          if-no-files-found: error
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must be semantic x.y.z, got $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create release tag when missing
        id: tag
        shell: pwsh
        run: |
          git fetch --tags origin
          $tagName = "v${{ steps.version.outputs.version }}"
          $existing = git ls-remote --tags origin "refs/tags/$tagName"
          if ($existing) {
            "created=false" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $tagName already exists."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tagName $env:GITHUB_SHA -m "Saeed AI ${{ steps.version.outputs.version }}"
            git push origin $tagName
            "created=true" >> $env:GITHUB_OUTPUT
            Write-Host "Created $tagName"
          }

      - name: Publish GitHub Release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Saeed AI ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/Saeed-AI-Setup-x64.exe
