name: Build Experimental - Native Vulkan
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-experimental-vulkan.yml"
      - "renderer_lab/experiments/vulkan/**"
permissions:
  contents: read
jobs:
  vulkan:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $url="https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          if($LASTEXITCODE -ne 0){throw "Vulkan SDK installer failed with code $LASTEXITCODE"}
          $sdk=Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if(!$sdk){throw "Vulkan SDK installation not found"}
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Create native Vulkan device probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force renderer_lab/experiments/vulkan | Out-Null
          @'
          #include <vulkan/vulkan.h>
          #include <cstdio>
          #include <vector>
          int main() {
              VkApplicationInfo ai{VK_STRUCTURE_TYPE_APPLICATION_INFO};
              ai.pApplicationName="Saeed Vulkan Probe";
              ai.applicationVersion=VK_MAKE_VERSION(1,0,0);
              ai.engineVersion=VK_MAKE_VERSION(1,0,0);
              ai.apiVersion=VK_API_VERSION_1_0;
              VkInstanceCreateInfo ci{VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO};
              ci.pApplicationInfo=&ai;
              VkInstance instance=VK_NULL_HANDLE;
              if(vkCreateInstance(&ci,nullptr,&instance)!=VK_SUCCESS) return 10;
              uint32_t count=0;
              if(vkEnumeratePhysicalDevices(instance,&count,nullptr)!=VK_SUCCESS || count==0) {
                  vkDestroyInstance(instance,nullptr);
                  return 11;
              }
              std::vector<VkPhysicalDevice> devices(count);
              vkEnumeratePhysicalDevices(instance,&count,devices.data());
              VkPhysicalDeviceProperties props{};
              vkGetPhysicalDeviceProperties(devices[0],&props);
              std::printf("VULKAN_OK device=%s api=%u.%u.%u\n",props.deviceName,VK_VERSION_MAJOR(props.apiVersion),VK_VERSION_MINOR(props.apiVersion),VK_VERSION_PATCH(props.apiVersion));
              vkDestroyInstance(instance,nullptr);
              return 0;
          }
          '@ | Set-Content renderer_lab/experiments/vulkan/main.cpp
          @'
          cmake_minimum_required(VERSION 3.25)
          project(SaeedVulkanProbe LANGUAGES CXX)
          find_package(Vulkan REQUIRED)
          add_executable(saeed_vulkan_probe main.cpp)
          target_link_libraries(saeed_vulkan_probe PRIVATE Vulkan::Vulkan)
          '@ | Set-Content renderer_lab/experiments/vulkan/CMakeLists.txt
      - name: Configure Vulkan probe
        shell: pwsh
        run: cmake -S renderer_lab/experiments/vulkan -B build-vulkan -G "Visual Studio 17 2022" -A x64
      - name: Build Vulkan probe
        shell: pwsh
        run: cmake --build build-vulkan --config Release -- /m:2
      - name: Verify Vulkan executable and runtime
        shell: pwsh
        run: |
          $exe="build-vulkan/Release/saeed_vulkan_probe.exe"
          if(!(Test-Path $exe)){throw "Vulkan probe EXE missing"}
          & ".\$exe"
          $code=$LASTEXITCODE
          "VULKAN_PROBE_EXIT=$code" | Out-File renderer_lab/experiments/vulkan/probe-result.txt
          if($code -eq 0){
            "VULKAN_RUNTIME_DEVICE_OK" | Out-File renderer_lab/experiments/vulkan/probe-result.txt -Append
          } elseif($code -eq 10 -or $code -eq 11){
            "VULKAN_RUNTIME_UNAVAILABLE_ON_GITHUB_RUNNER" | Out-File renderer_lab/experiments/vulkan/probe-result.txt -Append
            Write-Warning "Vulkan probe built successfully, but this GitHub runner has no usable Vulkan loader/device."
          } else {
            throw "Vulkan runtime/device probe failed with code $code"
          }
      - name: Upload Vulkan probe
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Experimental-Vulkan-${{ github.run_number }}
          path: |
            build-vulkan/Release/saeed_vulkan_probe.exe
            renderer_lab/experiments/vulkan/probe-result.txt