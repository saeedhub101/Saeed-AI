name: Repair current Saeed source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source repairs
        run: |
          python3 tools/repair_ui_voice_size.py
          python3 tools/final_repair.py
          python3 tools/cleanup_duplicates.py
          python3 tools/avatar_patch2.py
          python3 tools/compile_fix.py
          python3 tools/restore_build795_and_settings.py

      - name: Commit repaired source
        run: |
          git config user.name "Saeed AI Repair Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp assets/avatar.html assets/settings.html BRIDGE.md tools/restore_build795_and_settings.py tools/repair_ui_voice_size.py tools/final_repair.py tools/cleanup_duplicates.py tools/avatar_patch2.py tools/compile_fix.py .github/workflows/repair-current.yml
          if git diff --cached --quiet; then
            echo "No source changes required."
          else
            git commit -m "Restore Build 795 display and add Settings WebView2"
            git push
          fi
