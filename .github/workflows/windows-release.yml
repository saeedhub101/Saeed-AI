name: Saeed AI — Windows Build (Build Only)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'VERSION'
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for VERSION
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: saeed-windows-build-main
  cancel-in-progress: true
jobs:
  build:
    name: Build Windows installer only
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run build
      - name: Upload Windows EXE and installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-AI-windows-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
