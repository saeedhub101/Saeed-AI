name: Saeed AI — Windows Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'VERSION'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for VERSION
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: saeed-windows-build-main
  cancel-in-progress: true
jobs:
  build:
    name: Test and build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Validate version identity
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if ($releaseVersion -notmatch '^\d+\.\d+$') { throw "VERSION must be MAJOR.MINOR" }
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "$releaseVersion.0") { throw "package.json version does not match VERSION" }
          if ($pkg.build.buildVersion -ne $pkg.version) { throw "Electron buildVersion mismatch" }
      - name: Validate repository structure
        shell: pwsh
        run: |
          $required = @("package.json","VERSION","src/main.js","src/preload.js","src/renderer.js","src/avatar.js","src/agent.js","src/realtime.js","src/tools.js","src/tools/dispatcher.js","src/tools/schemas.js","assets/Saeed_AI-3D.glb")
          foreach ($path in $required) { if (-not (Test-Path $path -PathType Leaf)) { throw "Required file missing: $path" } }
      - name: Validate Always Listening contract
        shell: pwsh
        run: |
          $agent = Get-Content "src/agent.js" -Raw
          $renderer = Get-Content "src/renderer.js" -Raw
          if ($agent -notmatch "alwaysListening") { throw "Always Listening missing from agent.js" }
          if ($renderer -notmatch "alwaysListening") { throw "Always Listening missing from renderer.js" }
          if ($agent -notmatch 'micMode:\s*"always"') { throw "Always Listening microphone mode changed" }
      - name: Validate GLB architecture
        shell: pwsh
        run: |
          $avatar = Get-Content "src/avatar.js" -Raw
          if ($avatar -notmatch "GLTFLoader") { throw "GLB/Three.js loader missing" }
          if ($avatar -match "VRM") { throw "VRM architecture detected" }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static JavaScript validation
        run: npm test
      - name: Build Windows installer
        run: npm run build
      - name: Verify release output
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          $installers = @(Get-ChildItem "dist" -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*uninstaller*" })
          if ($installers.Count -ne 1) { throw "Expected exactly one installer EXE, found $($installers.Count)" }
          $installer = $installers[0]
          $expectedName = "Saeed.AI.Setup.$releaseVersion.0.exe"
          if ($installer.Name -ne $expectedName) { throw "Installer mismatch: expected $expectedName, found $($installer.Name)" }
          if ($installer.Length -lt 10000000) { throw "Installer is unexpectedly small" }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$sha  $($installer.Name)" | Set-Content "dist/Saeed-AI-Setup-x64.exe.sha256"
      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-AI-windows-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.sha256
      - name: Publish official release
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing duplicate."
            exit 1
          fi
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/*.sha256 \
            --title "Saeed AI ${VERSION}" \
            --notes "Official Windows release. Commit: ${{ github.sha }}. Workflow Build: ${{ github.run_number }}." \
            --target "${{ github.sha }}"
