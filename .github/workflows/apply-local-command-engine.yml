name: Apply Local Command Engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-local-command-engine.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch native offline command engine
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/main.cpp")
          s = p.read_text(encoding="utf-8")

          marker = "bool HandleOfflineSpeechCommand(const std::string& phrase){"
          if marker not in s:
              needle = "void HandleNativeSpeechEvent(){"
              if needle not in s:
                  raise SystemExit("Could not locate HandleNativeSpeechEvent")

              helper = r'''
bool SetDefaultEndpointVolume(float delta, bool mute){
    HRESULT ci=CoInitializeEx(nullptr,COINIT_MULTITHREADED);
    bool uninit=SUCCEEDED(ci);
    ComPtr<IMMDeviceEnumerator> enumerator;
    ComPtr<IMMDevice> device;
    ComPtr<IAudioEndpointVolume> volume;
    HRESULT hr=CoCreateInstance(__uuidof(MMDeviceEnumerator),nullptr,CLSCTX_ALL,IID_PPV_ARGS(&enumerator));
    if(SUCCEEDED(hr)) hr=enumerator->GetDefaultAudioEndpoint(eRender,eConsole,&device);
    if(SUCCEEDED(hr)) hr=device->Activate(__uuidof(IAudioEndpointVolume),CLSCTX_ALL,nullptr,reinterpret_cast<void**>(volume.GetAddressOf()));
    bool ok=false;
    if(SUCCEEDED(hr) && volume){
        if(mute) ok=SUCCEEDED(volume->SetMute(TRUE,nullptr));
        else {
            float current=0.0f;
            if(SUCCEEDED(volume->GetMasterVolumeLevelScalar(&current))){
                current=std::clamp(current+delta,0.0f,1.0f);
                ok=SUCCEEDED(volume->SetMasterVolumeLevelScalar(current,nullptr));
            }
        }
    }
    if(uninit) CoUninitialize();
    return ok;
}

static std::string LocalCommandLower(std::string s){
    std::transform(s.begin(),s.end(),s.begin(),[](unsigned char c){return static_cast<char>(std::tolower(c));});
    return s;
}

static bool LocalContainsAny(const std::string& s,const std::initializer_list<const char*>& words){
    for(const char* w:words) if(s.find(w)!=std::string::npos) return true;
    return false;
}

static bool OpenKnownWindowsTarget(const std::string& command){
    std::wstring target;
    if(LocalContainsAny(command,{"calculator","calc","حاسبة","آلة حاسبة"})) target=L"calc.exe";
    else if(LocalContainsAny(command,{"notepad","المفكرة","الملاحظات"})) target=L"notepad.exe";
    else if(LocalContainsAny(command,{"explorer","file explorer","مستكشف الملفات","الملفات"})) target=L"explorer.exe";
    else if(LocalContainsAny(command,{"chrome","كروم"})) target=L"chrome.exe";
    else if(LocalContainsAny(command,{"edge","مايكروسوفت إيدج","إيدج"})) target=L"msedge.exe";
    else return false;
    HINSTANCE r=ShellExecuteW(nullptr,L"open",target.c_str(),nullptr,nullptr,SW_SHOWNORMAL);
    return reinterpret_cast<INT_PTR>(r)>32;
}

static bool OpenSpecialFolder(const std::string& command){
    int csidl=-1;
    if(LocalContainsAny(command,{"downloads","download","التنزيلات","التنزيل"})) csidl=CSIDL_PERSONAL;
    else if(LocalContainsAny(command,{"documents","document","المستندات","الوثائق"})) csidl=CSIDL_PERSONAL;
    else if(LocalContainsAny(command,{"desktop","سطح المكتب"})) csidl=CSIDL_DESKTOPDIRECTORY;
    if(csidl<0) return false;

    wchar_t path[MAX_PATH]{};
    if(csidl==CSIDL_DESKTOPDIRECTORY){
        if(FAILED(SHGetFolderPathW(nullptr,CSIDL_DESKTOPDIRECTORY,nullptr,SHGFP_TYPE_CURRENT,path))) return false;
    }else{
        if(FAILED(SHGetFolderPathW(nullptr,CSIDL_PERSONAL,nullptr,SHGFP_TYPE_CURRENT,path))) return false;
        if(LocalContainsAny(command,{"downloads","download","التنزيلات","التنزيل"})){
            std::filesystem::path p(path);
            p/=L"Downloads";
            if(std::filesystem::exists(p)) wcscpy_s(path,p.wstring().c_str());
        }
    }
    HINSTANCE r=ShellExecuteW(nullptr,L"open",path,nullptr,nullptr,SW_SHOWNORMAL);
    return reinterpret_cast<INT_PTR>(r)>32;
}

static bool PlayFirstLocalMusic(){
    wchar_t music[MAX_PATH]{};
    if(FAILED(SHGetFolderPathW(nullptr,CSIDL_MYMUSIC,nullptr,SHGFP_TYPE_CURRENT,music))) return false;
    std::filesystem::path root(music);
    if(!std::filesystem::exists(root)) return false;
    static const std::vector<std::wstring> exts={L".mp3",L".wav",L".m4a",L".aac",L".wma",L".flac"};
    try{
        int checked=0;
        for(const auto& e:std::filesystem::recursive_directory_iterator(root,std::filesystem::directory_options::skip_permission_denied)){
            if(++checked>1000) break;
            if(!e.is_regular_file()) continue;
            auto ext=e.path().extension().wstring();
            std::transform(ext.begin(),ext.end(),ext.begin(),::towlower);
            if(std::find(exts.begin(),exts.end(),ext)!=exts.end()){
                HINSTANCE r=ShellExecuteW(nullptr,L"open",e.path().wstring().c_str(),nullptr,nullptr,SW_SHOWNORMAL);
                return reinterpret_cast<INT_PTR>(r)>32;
            }
        }
    }catch(...){}
    return false;
}

bool HandleOfflineSpeechCommand(const std::string& phrase){
    const std::string c=LocalCommandLower(phrase);
    if(c.empty()) return false;

    // These commands are deliberately handled before any AI/API call.
    if(LocalContainsAny(c,{"volume down","lower volume","turn down volume","خفض الصوت","اخفض الصوت","وطي الصوت","وطي"})){
        const bool ok=SetDefaultEndpointVolume(-0.10f,false);
        PostJson({{"type","native_command_result"},{"success",ok},{"message",ok?"Volume lowered.":"Could not change Windows volume."}});
        return true;
    }
    if(LocalContainsAny(c,{"volume up","increase volume","turn up volume","رفع الصوت","ارفع الصوت","علي الصوت","علّي الصوت"})){
        const bool ok=SetDefaultEndpointVolume(0.10f,false);
        PostJson({{"type","native_command_result"},{"success",ok},{"message",ok?"Volume increased.":"Could not change Windows volume."}});
        return true;
    }
    if(LocalContainsAny(c,{"mute","silence","كتم الصوت","اكتم الصوت"})){
        const bool ok=SetDefaultEndpointVolume(0.0f,true);
        PostJson({{"type","native_command_result"},{"success",ok},{"message",ok?"Microphone-independent system mute enabled.":"Could not mute Windows audio."}});
        return true;
    }
    if(LocalContainsAny(c,{"play music","play a song","play song","شغل اغنية","شغل أغنية","شغل موسيقى","شغّل اغنية","شغّل أغنية","شغّل موسيقى"})){
        const bool ok=PlayFirstLocalMusic();
        PostJson({{"type","native_command_result"},{"success",ok},{"message",ok?"Playing local music.":"No local music file was found in the Music folder."}});
        return true;
    }
    if(OpenKnownWindowsTarget(c)){
        PostJson({{"type","native_command_result"},{"success",true},{"message","Opened the requested Windows application."}});
        return true;
    }
    if(OpenSpecialFolder(c)){
        PostJson({{"type","native_command_result"},{"success",true},{"message","Opened the requested Windows folder."}});
        return true;
    }
    return false;
}

'''
              s = s.replace(needle, helper + needle, 1)

          old = 'if(!phrase.empty()) PostJson({{"type","speech_result"},{"text",phrase}});'
          new = 'if(!phrase.empty()){ if(!HandleOfflineSpeechCommand(phrase)) PostJson({{"type","speech_result"},{"text",phrase}}); }'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit("Could not locate speech result dispatch")

          p.write_text(s,encoding="utf-8")

          # Document the behavior for future agents.
          d=Path("AGENTS.md")
          ds=d.read_text(encoding="utf-8")
          note='''\n### Offline Local Command Engine\n\nNative SAPI recognition must route common Windows commands through the C++ local command engine before forwarding speech to any AI provider. Offline commands include volume up/down/mute, launching common Windows applications, opening common folders, and playing a local music file from the Music folder. These commands must not require an API key or internet access. Extend this engine rather than duplicating command handling in JavaScript.\n'''
          if "### Offline Local Command Engine" not in ds:
              d.write_text(ds+note,encoding="utf-8")

      - name: Commit native offline command engine
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp AGENTS.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add native offline Windows command engine"
            git push
          fi
