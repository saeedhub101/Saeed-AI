name: Build Saeed Native C++
on:
  push:
    branches: [ windows-csharp ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/Saeed.exe package/
          Copy-Item build/Release/WebView2Loader.dll package/
          Copy-Item -Recurse build/Release/assets package/assets
          Compress-Archive -Path package/* -DestinationPath Saeed-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Saeed-Windows-x64
          path: Saeed-Windows-x64.zip
