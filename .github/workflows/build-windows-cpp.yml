name: Build Saeed Native C++
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      HAS_SIGNING: ${{ secrets.CSC_PFX_BASE64 != '' && secrets.CSC_PFX_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare avatar and Three.js runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets/vendor | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/saeedhub101/saeed-assistant-preview/main/saeed.ai.glb" -OutFile "assets/saeed.ai.glb"
          npm pack three@0.180.0 --silent
          tar -xf three-0.180.0.tgz
          Copy-Item package/build/three.module.js assets/vendor/three.module.js
          Copy-Item package/examples/jsm/loaders/GLTFLoader.js assets/vendor/GLTFLoader.js
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Verify native release files
        shell: pwsh
        run: |
          if (!(Test-Path "build/Release/Saeed.exe")) { throw "Saeed.exe was not produced" }
          if (!(Test-Path "build/Release/WebView2Loader.dll")) { throw "WebView2Loader.dll was not produced" }
          if (!(Test-Path "build/Release/assets/avatar.html")) { throw "avatar.html is missing from release" }
          if (!(Test-Path "build/Release/assets/saeed.ai.glb")) { throw "saeed.ai.glb is missing from release" }
          Write-Host "Native C++ release payload verified."
      - name: Native Windows smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build/Release/Saeed.exe").Path
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) {
            throw "Saeed.exe exited during startup with code $($proc.ExitCode)"
          }
          $log = Join-Path $env:LOCALAPPDATA "Saeed\saeed.log"
          if (Test-Path $log) {
            Write-Host "Saeed process is running and startup log exists."
            Get-Content $log -Tail 30
          } else {
            Write-Warning "Saeed process is running, but no startup log was found yet."
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
      - name: Optional code signing
        if: ${{ env.HAS_SIGNING == 'true' }}
        shell: pwsh
        env:
          CSC_PFX_BASE64: ${{ secrets.CSC_PFX_BASE64 }}
          CSC_PFX_PASSWORD: ${{ secrets.CSC_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\saeed.pfx",[Convert]::FromBase64String($env:CSC_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /fd SHA256 /f "$env:RUNNER_TEMP\saeed.pfx" /p "$env:CSC_PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 "build/Release/Saeed.exe"
      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-out | Out-Null
          Copy-Item build/Release/Saeed.exe package-out/
          Copy-Item build/Release/WebView2Loader.dll package-out/
          Copy-Item -Recurse build/Release/assets package-out/assets
          Compress-Archive -Path package-out/* -DestinationPath Saeed-Windows-x64.zip -Force
      - name: Prepare WebView2 Runtime Bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-input | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer-input\\MicrosoftEdgeWebview2Setup.exe"
          if (!(Test-Path "installer-input\\MicrosoftEdgeWebview2Setup.exe")) { throw "WebView2 bootstrapper was not downloaded" }
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          Write-Host "Inno Setup: $iscc"
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-input | Out-Null
          Copy-Item build/Release/Saeed.exe installer-input/
          Copy-Item build/Release/WebView2Loader.dll installer-input/
          Copy-Item -Recurse build/Release/assets installer-input/assets
          if (!(Test-Path "installer-input\\MicrosoftEdgeWebview2Setup.exe")) { throw "WebView2 bootstrapper missing from installer input" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: Optional installer signing
        if: ${{ env.HAS_SIGNING == 'true' }}
        shell: pwsh
        env:
          CSC_PFX_BASE64: ${{ secrets.CSC_PFX_BASE64 }}
          CSC_PFX_PASSWORD: ${{ secrets.CSC_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\saeed.pfx",[Convert]::FromBase64String($env:CSC_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /fd SHA256 /f "$env:RUNNER_TEMP\saeed.pfx" /p "$env:CSC_PFX_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 "Output/Saeed-AI-Setup-x64.exe"
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          (Get-FileHash "Saeed-Windows-x64.zip" -Algorithm SHA256).Hash + "  Saeed-Windows-x64.zip" | Out-File "Saeed-Windows-x64.zip.sha256" -Encoding ascii
          (Get-FileHash "Output/Saeed-AI-Setup-x64.exe" -Algorithm SHA256).Hash + "  Saeed-AI-Setup-x64.exe" | Out-File "Saeed-AI-Setup-x64.exe.sha256" -Encoding ascii
      - name: Verify final artifacts
        shell: pwsh
        run: |
          $required = @(
            "Saeed-Windows-x64.zip",
            "Output/Saeed-AI-Setup-x64.exe",
            "Saeed-Windows-x64.zip.sha256",
            "Saeed-AI-Setup-x64.exe.sha256"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Required release artifact is missing: $path" }
          }
          Write-Host "All release artifacts verified."
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Windows-x64-${{ github.run_number }}
          path: |
            Saeed-Windows-x64.zip
            Output/Saeed-AI-Setup-x64.exe
            Saeed-Windows-x64.zip.sha256
            Saeed-AI-Setup-x64.exe.sha256
