name: Build Saeed Renderer Lab - 3 Screens
on:
  workflow_dispatch:
  push:
    paths:
      - "renderer_lab/native/**"
      - ".github/workflows/build-renderer-lab-3.yml"
      - "assets/Saeed_AI-3D.glb"
permissions:
  contents: read
jobs:
  windows-3-screen:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Filament
        shell: pwsh
        run: git clone --depth 1 https://github.com/google/filament.git third_party/filament
      - name: Configure native 3-screen renderer
        shell: pwsh
        run: cmake -S renderer_lab/native -B build-native -G "Visual Studio 17 2022" -A x64 -DFILAMENT_ROOT="$pwd/third_party/filament" -DFILAMENT_BUILD_FILAMAT=OFF -DFILAMENT_ENABLE_MATDBG=OFF -DFILAMENT_ENABLE_SAMPLES=OFF -DFILAMENT_SUPPORTS_OPENGL=ON -DFILAMENT_SUPPORTS_VULKAN=OFF
      - name: Build native 3-screen EXE
        shell: pwsh
        run: cmake --build build-native --config Release --target saeed_renderer_lab_native -- /m:2
      - name: Assemble and verify complete Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build-native/Release/saeed_renderer_lab_native.exe out/Saeed-Renderer-Lab-3-Screens.exe
          Copy-Item assets/Saeed_AI-3D.glb out/saeed.ai.glb

          # Static MSVC runtime and static Filament linkage mean no native DLL is expected.
          @" 
          Saeed Renderer Lab — 3 Screens
          Windows x64 portable package

          Included:
          - Saeed-Renderer-Lab-3-Screens.exe
          - saeed.ai.glb
          - README-RUN.txt

          Renderers:
          1. DirectX 11 / D3D11
          2. Native OpenGL / WGL
          3. Google Filament

          The EXE and GLB must stay together.
          "@ | Set-Content out/README-RUN.txt

          if(!(Test-Path out/Saeed-Renderer-Lab-3-Screens.exe)){throw "3-screen EXE missing"}
          $exe = Get-Item out/Saeed-Renderer-Lab-3-Screens.exe
          Write-Host "3-screen EXE size: $($exe.Length) bytes"
          if($exe.Length -lt 500000){throw "3-screen EXE unexpectedly small"}
          if(!(Test-Path out/saeed.ai.glb)){throw "3-screen GLB missing"}
          $glb = Get-Item out/saeed.ai.glb
          Write-Host "3-screen GLB size: $($glb.Length) bytes"
          Get-ChildItem out -File | Select-Object Name,Length
      - name: Upload complete 3-screen package
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Renderer-Lab-3-Screens-Package-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
      - name: Upload 3-screen EXE
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Renderer-Lab-3-Screens-${{ github.run_number }}
          path: out/Saeed-Renderer-Lab-3-Screens.exe
      - name: Upload 3-screen GLB
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Renderer-Lab-3-Screens-Files-${{ github.run_number }}
          path: out/saeed.ai.glb