name: Saeed AI - Verified Windows Build
on:
  push:
    branches: [main]
    paths: ['src/**','assets/**','scripts/**','package.json','package-lock.json','VERSION','.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Validate contracts
        shell: pwsh
        run: |
          $v=(Get-Content VERSION -Raw).Trim()
          $p=Get-Content package.json -Raw|ConvertFrom-Json
          if($p.version -ne "$v.0"){throw "Version mismatch"}
          if($p.build.buildVersion -ne $p.version){throw "BuildVersion mismatch"}
          if(-not (Test-Path assets/Saeed_AI-3D.glb)){throw "GLB missing"}
          $a=Get-Content src/agent.js -Raw
          $r=Get-Content src/renderer.js -Raw
          if($a -notmatch "alwaysListening" -or $r -notmatch "alwaysListening" -or $a -notmatch 'micMode:\s*"always"'){throw "Always Listening contract failed"}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:module-resolution
      - run: npm run test:preflight
      - run: npm run test:permissions
      - run: npm run build
      - name: Verified packaged gate
        run: npm run test:packaged
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-AI-Verified-Windows-\${{ github.sha }}
          path: |
            dist/Saeed.AI.Setup.*.exe
            dist/Saeed-AI-Setup-x64.exe.sha256
          if-no-files-found: error
