<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saeed AI — Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Segoe UI,Tahoma,sans-serif;background:#10141b;color:#fff;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.app{width:min(1100px,94vw);height:min(720px,92vh);position:relative;border:1px solid #384250;border-radius:24px;background:linear-gradient(145deg,#1b2230,#0e1219);box-shadow:0 30px 80px #0008;overflow:hidden}
.top{height:58px;border-bottom:1px solid #303846;display:flex;align-items:center;padding:0 20px;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;background:#63d483;box-shadow:0 0 12px #63d483}.title{font-weight:700;font-size:18px}.status{color:#8f9bad;font-size:13px}
.content{height:calc(100% - 58px);display:flex}
.stage{width:42%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#273348 0,#121822 55%,#0d1118 100%)}
.avatar{width:210px;height:320px;position:relative;animation:float 3s ease-in-out infinite}
.head{position:absolute;width:145px;height:145px;border-radius:50%;background:#3f6fbd;top:25px;left:32px;box-shadow:inset -14px -12px 25px #234477}
.body{position:absolute;width:105px;height:150px;border-radius:50px;top:150px;left:52px;background:#315c9e}
.eye{position:absolute;width:19px;height:26px;border-radius:50%;background:#fff;top:82px;z-index:2}.eye:after{content:"";display:block;width:8px;height:12px;background:#111;border-radius:50%;margin:7px auto}
.e1{left:70px}.e2{left:127px}.mouth{position:absolute;width:48px;height:22px;border-bottom:6px solid #17243a;border-radius:50%;top:125px;left:80px;z-index:2}
.arm{position:absolute;width:28px;height:105px;background:#315c9e;border-radius:18px;top:170px}.a1{left:25px;transform:rotate(10deg)}.a2{right:25px;transform:rotate(-10deg)}
.shadow{position:absolute;width:190px;height:28px;background:#0008;border-radius:50%;bottom:28px;left:10px;filter:blur(8px)}
@keyframes float{50%{transform:translateY(-8px) rotateY(4deg)}}
.chat{width:58%;padding:24px;display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;padding:5px}.msg{max-width:82%;padding:12px 16px;margin:10px 0;border-radius:16px;line-height:1.6}.assistant{background:#222b3a}.user{background:#315c9e;margin-right:auto}.welcome{opacity:.75}
.input{display:flex;gap:10px;border-top:1px solid #303846;padding-top:15px}.input input{flex:1;background:#171d27;border:1px solid #394454;color:white;border-radius:14px;padding:13px}.input button{border:0;border-radius:14px;background:#3f6fbd;color:#fff;padding:0 22px;font-size:20px}
.badge{position:absolute;bottom:22px;right:22px;background:#1c2532;border:1px solid #3a4658;border-radius:12px;padding:8px 12px;color:#aeb9c8;font-size:12px}
@media(max-width:760px){.content{display:block;overflow:auto}.stage,.chat{width:100%}.stage{height:45%}.chat{height:55%}.avatar{transform:scale(.65)}}
</style></head>
<body>
<div class="app">
<div class="top"><span class="dot"></span><span class="title">سعيد AI</span><span class="status">وضع المعاينة — الواجهة</span></div>
<div class="content">
<section class="stage">
<div class="avatar"><div class="head"></div><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="shadow"></div></div>
<div class="badge">3D Avatar Preview</div>
</section>
<section class="chat">
<div class="messages"><div class="msg assistant">مرحبًا، أنا سعيد. هذه صفحة فحص الواجهة الحالية للمشروع.</div><div class="msg assistant welcome">النسخة الحقيقية تعمل كتطبيق Windows وتحتوي على Agent وأدوات التحكم بالنظام.</div></div>
<div class="input"><input placeholder="اكتب رسالة للمعاينة..." disabled><button disabled>➤</button></div>
</section>
</div></div>
</body></html>
