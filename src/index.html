<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Saeed AI</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"../node_modules/three/build/three.webgpu.js","three/webgpu":"../node_modules/three/build/three.webgpu.js","three/tsl":"../node_modules/three/build/three.webgpu.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script></head><body>
<div id="character" title="Click: face me + quick actions • Double-click: Chat • Drop a GLB here"><canvas id="avatar"></canvas><div class="shadow"></div><div id="badge" class="badge hidden">0</div><div id="notificationBubble" class="notificationBubble hidden"></div><div id="listening" class="listening hidden">● Listening…</div><div id="quickMenu" class="quickMenu hidden">
<button id="chatBtn">Chat</button><button id="muteBtn">Mute</button><button id="micBtn">Open mic</button><button id="capture">Screen</button><button id="updateBtn">Check updates</button><button id="aiBtn">AI providers</button><button id="changeCharacter">Change character</button><button id="exitBtn">Exit</button><input id="characterFile" type="file" accept=".glb" hidden>
</div></div>
<section id="panel"><header><div class="chatAvatar">S</div><div class="chatTitle"><strong>Saeed</strong><small id="status">Online</small></div><button id="history" title="Notifications">⋮</button><button id="togglePanel" title="Close">×</button></header><main id="messages"><div class="msg assistant">Hello, I am Saeed. Tell me what you want me to do.</div></main><footer><div id="attachments"></div><textarea id="input" placeholder="Type a command or drop a text file..."></textarea><button id="send">➤</button></footer></section>
<section id="aiPanel" class="aiPanel hidden">
 <header><div class="chatAvatar">AI</div><div class="chatTitle"><strong>AI Providers</strong><small>Connect your own API key</small></div><button id="closeAi">×</button></header>
 <div class="aiBody">
  <label>Provider<select id="aiProvider"></select></label>
  <label>Model<input id="aiModel" autocomplete="off"></label>
  <label>API base URL<input id="aiBaseUrl" autocomplete="off"></label>
  <label>API key<input id="aiKey" type="password" autocomplete="new-password" placeholder="Enter key — stored encrypted on this PC"></label>
  <div class="aiActions"><button id="providerKeyLink">Get API key</button><button id="saveAi">Save connection</button></div>
  <div id="aiStatus" class="aiStatus"></div>
  <small class="aiSecurity">Your key is never committed to GitHub. Saeed stores it locally using Windows secure storage when available.</small>
 </div>
</section>
<div id="notifications" class="notifications hidden"></div>
<script src="renderer.js"></script><script type="module" src="avatar.js"></script></body></html>
