<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saeed AI — Character</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}#status{position:fixed;left:8px;bottom:6px;font:10px "Segoe UI",sans-serif;color:rgba(255,255,255,.65);text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;transition:opacity .2s}.error #status{opacity:1;color:#ffb4b4}</style></head>
<body><canvas id="c"></canvas><div id="status"></div>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
const canvas=document.getElementById("c"),status=document.getElementById("status");
window.__SAEED_WEBGL_READY__=false;window.__SAEED_GLTF_READY__=false;window.__SAEED_RENDERER_READY__=false;
function fail(message){document.body.classList.add("error");status.textContent=message;console.error("Saeed character:",message);window.__SAEED_CHARACTER_ERROR__=message}
try{
 const gl=canvas.getContext("webgl2",{alpha:true,antialias:true,preserveDrawingBuffer:false})||canvas.getContext("webgl",{alpha:true,antialias:true,preserveDrawingBuffer:false});
 if(!gl)throw new Error("WebGL unavailable");window.__SAEED_WEBGL_READY__=true;
 const renderer=new THREE.WebGLRenderer({canvas,context:gl,alpha:true,antialias:true,powerPreference:"low-power"});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.setClearColor(0,0);window.__SAEED_RENDERER_READY__=true;
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,1,.01,100);
 const hemi=new THREE.HemisphereLight(0xffffff,0x777777,2.2);scene.add(hemi);
 const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(2,4,3);scene.add(key);
 let root=null,mixer=null,clock=new THREE.Clock(),lastRender=0;
 function resize(){const w=Math.max(1,canvas.clientWidth),h=Math.max(1,canvas.clientHeight);if(canvas.width!==Math.floor(w*renderer.getPixelRatio())||canvas.height!==Math.floor(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
 function frame(object){const box=new THREE.Box3().setFromObject(object),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const max=Math.max(size.x,size.y,size.z)||1;camera.position.set(center.x,center.y+size.y*.03,center.z+max*3.0);camera.lookAt(center.x,center.y,center.z);camera.near=Math.max(.001,max/1000);camera.far=max*20;camera.updateProjectionMatrix()}
 new GLTFLoader().load("../assets/Saeed_AI-3D.glb",gltf=>{
   root=gltf.scene;scene.add(root);frame(root);window.__SAEED_GLTF_READY__=true;
   if(gltf.animations?.length){mixer=new THREE.AnimationMixer(root);const idle=gltf.animations.find(a=>/idle|stand|breath|rest|default/i.test(a.name))||gltf.animations[0];mixer.clipAction(idle).play()}
   if(window.saeed?.characterReady)window.saeed.characterReady({animations:gltf.animations?.map(a=>a.name)||[]});
 },undefined,e=>fail("3D character failed to load: "+e.message));
 function render(t){requestAnimationFrame(render);resize();if(!root)return;const dt=Math.min(clock.getDelta(),.05);if(mixer)mixer.update(dt);if(t-lastRender<33)return;lastRender=t;renderer.render(scene,camera)}
 requestAnimationFrame(render);
 window.addEventListener("resize",resize);
}catch(e){fail(e.message)}
</script></body></html>
